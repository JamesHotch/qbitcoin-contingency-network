[package]
name = "qbitcoin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental Bitcoin-style post-quantum contingency testnet"
repository = "https://github.com/JamesHotch/qbitcoin-contingency-network"
publish = false
build = "build.rs"

[features]
default = []

[dependencies]
hex = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["alloc", "arithmetic", "getrandom", "precomputed-tables", "schnorr", "std"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
primitive-types = { version = "0.13.1", features = ["serde"] }
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1.7"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.dev]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
