[package]
name = "qbitcoin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental Bitcoin-style post-quantum contingency testnet"
repository = "https://github.com/JamesHotch/qbitcoin-contingency-network"
publish = false
build = "build.rs"

[features]
default = []

[dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.7"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"

[profile.dev]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

