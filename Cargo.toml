[package]
name = "qbitcoin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Experimental Bitcoin-style post-quantum contingency testnet"
repository = "https://github.com/JamesHotch/qbitcoin-contingency-network"
publish = false
build = "build.rs"

[features]
default = []

[dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.23.0"
bech32 = "0.12.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
hex = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["alloc", "arithmetic", "getrandom", "precomputed-tables", "schnorr", "std"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
primitive-types = { version = "0.13.1", features = ["serde"] }
rand = "0.10.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1.7"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These API-documentation and size heuristics are intentionally handled by
# project-level protocol documents and focused review rather than per-function
# boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Serde's `serialize_with` callback contract requires `&Option<T>`.
ref_option = "allow"
