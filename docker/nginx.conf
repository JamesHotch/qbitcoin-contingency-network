server {
    listen 80;
    server_name _;

    location /v1/ {
        proxy_pass http://node1:58332;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://node1:58332/metrics;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

