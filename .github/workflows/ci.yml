name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict static analysis
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Build API documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  devnet:
    name: Docker development network
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure non-secret CI development credentials
        run: cp .env.devnet.example .env.devnet

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start complete development topology
        run: docker compose up --detach --build

      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:58332/v1/status >/dev/null \
              && curl --fail --silent http://127.0.0.1:8090/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "development services did not become healthy" >&2
              exit 1
            fi
            sleep 5
          done
          test "$(docker compose ps --status running --services | wc -l)" -ge 20

      - name: Run progressive-finality demonstration
        shell: bash
        run: |
          docker compose --profile tools run --rm demo --mode run | tee run-demo.json
          jq --exit-status '.passed == true and (.steps | length) == 17' run-demo.json

      - name: Run adversarial demonstration
        shell: bash
        run: |
          docker compose --profile tools run --rm demo --mode attack | tee attack-demo.json
          jq --exit-status '.passed == true and (.steps | length) == 13' attack-demo.json

      - name: Show container state and failure logs
        if: always()
        shell: bash
        run: |
          docker compose ps --all
          if [[ "${{ job.status }}" != "success" ]]; then
            docker compose logs --no-color --tail 200
          fi

      - name: Stop development topology
        if: always()
        run: docker compose down --volumes --remove-orphans

  reproducible:
    name: Reproducible release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Compare two clean release builds
        run: ./scripts/reproducible-build.sh
